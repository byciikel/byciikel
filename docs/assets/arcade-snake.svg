<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Retro arcade screen showing a snake game demo">
  <defs>
    <linearGradient id="crt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141426"/>
      <stop offset="1" stop-color="#0F0F1B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(255,255,255,0.03)"/>
    </pattern>
  </defs>

  <!-- cabinet frame -->
  <rect x="4" y="4" width="592" height="332" rx="14" fill="url(#crt)" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="4" y="4" width="592" height="332" rx="14" fill="url(#scan)"/>

  <!-- header -->
  <text x="300" y="42" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#FFD166">BAYU ARCADE</text>
  <text x="24" y="42" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="12" fill="#22D3EE">SCORE 00420</text>
  <text x="576" y="42" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#FF2E88">HI 999999</text>
  <line x1="20" y1="56" x2="580" y2="56" stroke="url(#glow)" stroke-width="1.5"/>

  <!-- grid board -->
  <g transform="translate(40 76)">
    <rect width="520" height="200" rx="6" fill="#0A0A14" stroke="#A78BFA" stroke-opacity="0.35"/>
    <!-- subtle grid dots -->
    <g fill="#A78BFA" fill-opacity="0.12">
      <circle cx="26" cy="26" r="1"/><circle cx="78" cy="26" r="1"/><circle cx="130" cy="26" r="1"/><circle cx="182" cy="26" r="1"/><circle cx="234" cy="26" r="1"/><circle cx="286" cy="26" r="1"/><circle cx="338" cy="26" r="1"/><circle cx="390" cy="26" r="1"/><circle cx="442" cy="26" r="1"/><circle cx="494" cy="26" r="1"/>
      <circle cx="26" cy="78" r="1"/><circle cx="78" cy="78" r="1"/><circle cx="130" cy="78" r="1"/><circle cx="182" cy="78" r="1"/><circle cx="234" cy="78" r="1"/><circle cx="286" cy="78" r="1"/><circle cx="338" cy="78" r="1"/><circle cx="390" cy="78" r="1"/><circle cx="442" cy="78" r="1"/><circle cx="494" cy="78" r="1"/>
      <circle cx="26" cy="130" r="1"/><circle cx="78" cy="130" r="1"/><circle cx="130" cy="130" r="1"/><circle cx="182" cy="130" r="1"/><circle cx="234" cy="130" r="1"/><circle cx="286" cy="130" r="1"/><circle cx="338" cy="130" r="1"/><circle cx="390" cy="130" r="1"/><circle cx="442" cy="130" r="1"/><circle cx="494" cy="130" r="1"/>
      <circle cx="26" cy="174" r="1"/><circle cx="78" cy="174" r="1"/><circle cx="130" cy="174" r="1"/><circle cx="182" cy="174" r="1"/><circle cx="234" cy="174" r="1"/><circle cx="286" cy="174" r="1"/><circle cx="338" cy="174" r="1"/><circle cx="390" cy="174" r="1"/><circle cx="442" cy="174" r="1"/><circle cx="494" cy="174" r="1"/>
    </g>

    <!-- food pellet, pulsing -->
    <circle cx="420" cy="100" r="7" fill="#FFD166" filter="url(#neon)">
      <animate attributeName="r" values="7;4.5;7" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="0.9s" repeatCount="indefinite"/>
    </circle>

    <!-- snake body: 8 segments, each follows the previous with a 0.15s cascade -->
    <g filter="url(#neon)" fill="#22D3EE">
      <g><animateTransform attributeName="transform" type="translate" values="60,100;480,100;480,60;60,60;60,100" dur="12s" repeatCount="indefinite" keyTimes="0;0.62;0.76;0.94;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <rect x="-9" y="-9" width="18" height="18" rx="4"/>
        <animate attributeName="fill" values="#FF2E88;#FF2E88;#FF2E88;#FF2E88;#22D3EE" dur="3.6s" repeatCount="indefinite"/>
      </g>
      <g><animateTransform attributeName="transform" type="translate" values="38,100;480,100;480,60;60,60;38,100" dur="12s" repeatCount="indefinite" begin="0.15s" keyTimes="0;0.62;0.76;0.94;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <rect x="-9" y="-9" width="18" height="18" rx="4"/>
        <animate attributeName="fill" values="#FF2E88;#FF2E88;#FF2E88;#FF2E88;#22D3EE" dur="3.6s" repeatCount="indefinite" begin="0.15s"/>
      </g>
      <g><animateTransform attributeName="transform" type="translate" values="16,100;480,100;480,60;60,60;16,100" dur="12s" repeatCount="indefinite" begin="0.3s" keyTimes="0;0.62;0.76;0.94;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <rect x="-9" y="-9" width="18" height="18" rx="4"/>
        <animate attributeName="fill" values="#FF2E88;#FF2E88;#FF2E88;#FF2E88;#22D3EE" dur="3.6s" repeatCount="indefinite" begin="0.3s"/>
      </g>
      <g><animateTransform attributeName="transform" type="translate" values="-6,100;480,100;480,60;60,60;-6,100" dur="12s" repeatCount="indefinite" begin="0.45s" keyTimes="0;0.62;0.76;0.94;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <rect x="-9" y="-9" width="18" height="18" rx="4"/>
        <animate attributeName="fill" values="#FF2E88;#FF2E88;#FF2E88;#FF2E88;#22D3EE" dur="3.6s" repeatCount="indefinite" begin="0.45s"/>
      </g>
      <g><animateTransform attributeName="transform" type="translate" values="-28,100;480,100;480,60;60,60;-28,100" dur="12s" repeatCount="indefinite" begin="0.6s" keyTimes="0;0.62;0.76;0.94;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <rect x="-9" y="-9" width="18" height="18" rx="4"/>
        <animate attributeName="fill" values="#FF2E88;#FF2E88;#FF2E88;#FF2E88;#22D3EE" dur="3.6s" repeatCount="indefinite" begin="0.6s"/>
      </g>
      <g><animateTransform attributeName="transform" type="translate" values="-50,100;480,100;480,60;60,60;-50,100" dur="12s" repeatCount="indefinite" begin="0.75s" keyTimes="0;0.62;0.76;0.94;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <rect x="-9" y="-9" width="18" height="18" rx="4"/>
        <animate attributeName="fill" values="#FF2E88;#FF2E88;#FF2E88;#FF2E88;#22D3EE" dur="3.6s" repeatCount="indefinite" begin="0.75s"/>
      </g>
      <g><animateTransform attributeName="transform" type="translate" values="-72,100;480,100;480,60;60,60;-72,100" dur="12s" repeatCount="indefinite" begin="0.9s" keyTimes="0;0.62;0.76;0.94;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <rect x="-9" y="-9" width="18" height="18" rx="4"/>
        <animate attributeName="fill" values="#FF2E88;#FF2E88;#FF2E88;#FF2E88;#22D3EE" dur="3.6s" repeatCount="indefinite" begin="0.9s"/>
      </g>
      <g><animateTransform attributeName="transform" type="translate" values="-94,100;480,100;480,60;60,60;-94,100" dur="12s" repeatCount="indefinite" begin="1.05s" keyTimes="0;0.62;0.76;0.94;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <rect x="-9" y="-9" width="18" height="18" rx="4"/>
        <animate attributeName="fill" values="#FF2E88;#FF2E88;#FF2E88;#FF2E88;#22D3EE" dur="3.6s" repeatCount="indefinite" begin="1.05s"/>
      </g>
    </g>
  </g>

  <!-- footer: attract-mode blink -->
  <text x="300" y="310" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#FFD166">INSERT COIN &#9654; PLAY
    <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
