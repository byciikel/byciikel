<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Retro arcade screen showing a snake game demo">
  <defs>
    <linearGradient id="crt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141426"/>
      <stop offset="1" stop-color="#0F0F1B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(255,255,255,0.03)"/>
    </pattern>
    <clipPath id="board">
      <rect x="40" y="76" width="520" height="200" rx="6"/>
    </clipPath>
    <!-- closed loop around the board interior; legs 100/480/100/480 px.
         keyPoints=keyTimes keeps speed constant across unequal legs. -->
    <path id="loop" d="M 60,176 L 60,76 L 540,76 L 540,176 L 60,176" fill="none"/>
  </defs>

  <!-- cabinet frame -->
  <rect x="4" y="4" width="592" height="332" rx="14" fill="url(#crt)" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="4" y="4" width="592" height="332" rx="14" fill="url(#scan)"/>

  <!-- header -->
  <text x="300" y="42" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#FFD166" textLength="180" lengthAdjust="spacing">BAYU ARCADE</text>
  <text x="24" y="42" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="12" fill="#22D3EE">SCORE 00420</text>
  <text x="576" y="42" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#FF2E88">HI 999999</text>
  <line x1="20" y1="56" x2="580" y2="56" stroke="url(#glow)" stroke-width="1.5"/>

  <!-- board -->
  <rect x="40" y="76" width="520" height="200" rx="6" fill="#0A0A14" stroke="#A78BFA" stroke-opacity="0.35"/>

  <!-- gameplay, hard-clipped to the board -->
  <g clip-path="url(#board)">
    <g filter="url(#neon)">
      <!-- head: magenta, leads the chain -->
      <g>
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
          keyPoints="0;0.0862;0.5;0.5862;1" keyTimes="0;0.0862;0.5;0.5862;1">
          <mpath href="#loop"/>
        </animateMotion>
        <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#FF2E88"/>
      </g>
      <!-- body: cyan, each trailing the head by one 18px step (12s x 18/1160 = 0.186s).
           Negative begin = mid-loop at t=0, so nothing waits at the origin. -->
      <g>
        <animateMotion dur="12s" repeatCount="indefinite" begin="-11.814s" calcMode="linear"
          keyPoints="0;0.0862;0.5;0.5862;1" keyTimes="0;0.0862;0.5;0.5862;1">
          <mpath href="#loop"/>
        </animateMotion>
        <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#22D3EE"/>
      </g>
      <g>
        <animateMotion dur="12s" repeatCount="indefinite" begin="-11.628s" calcMode="linear"
          keyPoints="0;0.0862;0.5;0.5862;1" keyTimes="0;0.0862;0.5;0.5862;1">
          <mpath href="#loop"/>
        </animateMotion>
        <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#22D3EE"/>
      </g>
      <g>
        <animateMotion dur="12s" repeatCount="indefinite" begin="-11.442s" calcMode="linear"
          keyPoints="0;0.0862;0.5;0.5862;1" keyTimes="0;0.0862;0.5;0.5862;1">
          <mpath href="#loop"/>
        </animateMotion>
        <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#22D3EE"/>
      </g>
      <g>
        <animateMotion dur="12s" repeatCount="indefinite" begin="-11.256s" calcMode="linear"
          keyPoints="0;0.0862;0.5;0.5862;1" keyTimes="0;0.0862;0.5;0.5862;1">
          <mpath href="#loop"/>
        </animateMotion>
        <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#22D3EE"/>
      </g>
      <g>
        <animateMotion dur="12s" repeatCount="indefinite" begin="-11.07s" calcMode="linear"
          keyPoints="0;0.0862;0.5;0.5862;1" keyTimes="0;0.0862;0.5;0.5862;1">
          <mpath href="#loop"/>
        </animateMotion>
        <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#22D3EE"/>
      </g>
      <g>
        <animateMotion dur="12s" repeatCount="indefinite" begin="-10.884s" calcMode="linear"
          keyPoints="0;0.0862;0.5;0.5862;1" keyTimes="0;0.0862;0.5;0.5862;1">
          <mpath href="#loop"/>
        </animateMotion>
        <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#22D3EE"/>
      </g>
      <g>
        <animateMotion dur="12s" repeatCount="indefinite" begin="-10.698s" calcMode="linear"
          keyPoints="0;0.0862;0.5;0.5862;1" keyTimes="0;0.0862;0.5;0.5862;1">
          <mpath href="#loop"/>
        </animateMotion>
        <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#22D3EE"/>
      </g>
    </g>

    <!-- pulsing food pellet, off the snake's path -->
    <circle cx="300" cy="126" r="7" fill="#FFD166" filter="url(#neon)">
      <animate attributeName="r" values="7;4.5;7" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- footer: attract-mode blink -->
  <text x="300" y="310" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#FFD166" textLength="220" lengthAdjust="spacing">INSERT COIN &#9654; PLAY
    <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
