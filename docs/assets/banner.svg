<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="byciikel — arcade marquee banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141426"/>
      <stop offset="1" stop-color="#0F0F1B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset="0.35" stop-color="#A78BFA"/>
      <stop offset="0.7" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(255,255,255,0.03)"/>
    </pattern>
  </defs>

  <!-- bezel -->
  <rect x="4" y="4" width="1192" height="212" rx="14" fill="url(#bg)" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="4" y="4" width="1192" height="212" rx="14" fill="url(#scan)"/>

  <!-- corner pixels -->
  <g shape-rendering="crispEdges">
    <rect x="26"  y="26" width="10" height="10" fill="#FF2E88"/>
    <rect x="1164" y="26" width="10" height="10" fill="#22D3EE"/>
    <rect x="26"  y="184" width="10" height="10" fill="#FFD166"/>
    <rect x="1164" y="184" width="10" height="10" fill="#A78BFA"/>
  </g>

  <!-- eyebrow -->
  <text x="600" y="66" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#A78BFA" textLength="220" lengthAdjust="spacing">&#9656; PLAYER 1 READY</text>

  <!-- name -->
  <text x="600" y="128" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="52" font-weight="bold" fill="#E8E6F0" textLength="320" lengthAdjust="spacing" filter="url(#neon)">BYCIIKEL
    <animate attributeName="fill" values="#E8E6F0;#E8E6F0;#22D3EE;#E8E6F0;#E8E6F0" keyTimes="0;0.44;0.5;0.56;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- gradient rule -->
  <rect x="420" y="152" width="360" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- blinking cursor -->
  <rect x="770" y="92" width="13" height="36" fill="#FF2E88" filter="url(#neon)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
