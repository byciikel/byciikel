<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Bayu Arcade — Snake</title>
<style>
  :root {
    --cabinet: #0F0F1B;
    --screen: #0A0A14;
    --magenta: #FF2E88;
    --cyan: #22D3EE;
    --amber: #FFD166;
    --violet: #A78BFA;
    --text: #E8E6F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--cabinet);
    color: var(--text);
    font-family: Menlo, Consolas, "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-size: clamp(16px, 4vw, 22px);
    letter-spacing: 6px;
    color: var(--amber);
    text-transform: uppercase;
  }
  .hud {
    display: flex;
    gap: 28px;
    font-size: 13px;
    letter-spacing: 2px;
  }
  .hud .score { color: var(--cyan); }
  .hud .hi { color: var(--magenta); }
  .cabinet {
    background: var(--screen);
    border: 2px solid var(--violet);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 0 24px rgba(167, 139, 250, 0.25);
    position: relative;
  }
  canvas { display: block; border-radius: 8px; background: var(--screen); }
  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 8px;
    background: rgba(10, 10, 20, 0.86);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay .title { font-size: 18px; letter-spacing: 4px; color: var(--magenta); }
  .overlay .sub { font-size: 12px; color: var(--amber); letter-spacing: 2px; }
  .btn {
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--screen);
    background: var(--amber);
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  .pad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 6px;
    margin-top: 4px;
  }
  .pad button {
    font-family: inherit;
    font-size: 18px;
    color: var(--violet);
    background: var(--screen);
    border: 1.5px solid var(--violet);
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .pad button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .hint { font-size: 11px; letter-spacing: 2px; color: var(--violet); opacity: 0.8; }
  @media (hover: none) and (pointer: coarse) { .pad { display: grid; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <h1>Bayu Arcade</h1>
  <div class="hud">
    <span class="score">SCORE <span id="score">0000</span></span>
    <span class="hi">HI <span id="hi">0000</span></span>
  </div>

  <div class="cabinet">
    <canvas id="game" width="420" height="420" aria-label="Snake game board"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="ovTitle">READY PLAYER ONE</div>
      <div class="sub" id="ovSub">ARROWS / WASD / SWIPE</div>
      <button class="btn" id="startBtn">INSERT COIN ▶ PLAY</button>
    </div>
  </div>

  <div class="pad" id="pad">
    <button class="up" data-dir="up" aria-label="Move up">▲</button>
    <button class="left" data-dir="left" aria-label="Move left">◀</button>
    <button class="down" data-dir="down" aria-label="Move down">▼</button>
    <button class="right" data-dir="right" aria-label="Move right">▶</button>
  </div>

  <div class="hint">← BACK TO PROFILE</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var hiEl = document.getElementById('hi');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');
  var startBtn = document.getElementById('startBtn');
  var pad = document.getElementById('pad');

  var GRID = 21;
  var CELL = canvas.width / GRID;
  var BASE_TICK = 140;
  var MIN_TICK = 70;

  var DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };
  var KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  var snake, dir, nextDir, food, score, hi, tickMs, timer, running;

  hi = parseInt(localStorage.getItem('bayu-arcade-hi') || '0', 10);
  renderHi();

  function pad4(n) {
    var s = String(n);
    while (s.length < 4) s = '0' + s;
    return s;
  }

  function renderScore() { scoreEl.textContent = pad4(score); }
  function renderHi() { hiEl.textContent = pad4(hi); }

  function spawnFood() {
    var free = [];
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        var taken = snake.some(function (s) { return s.x === x && s.y === y; });
        if (!taken) free.push({ x: x, y: y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function reset() {
    var mid = Math.floor(GRID / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = DIRS.right;
    nextDir = DIRS.right;
    score = 0;
    tickMs = BASE_TICK;
    renderScore();
    spawnFood();
  }

  function start() {
    reset();
    running = true;
    overlay.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(step, tickMs);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > hi) {
      hi = score;
      localStorage.setItem('bayu-arcade-hi', String(hi));
      renderHi();
      ovTitle.textContent = 'NEW HI-SCORE!';
    } else {
      ovTitle.textContent = 'GAME OVER';
    }
    ovSub.textContent = 'SCORE ' + pad4(score);
    startBtn.textContent = 'INSERT COIN ▶ RETRY';
    overlay.classList.remove('hidden');
  }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      renderScore();
      spawnFood();
      tickMs = Math.max(MIN_TICK, tickMs - 4);
      clearInterval(timer);
      timer = setInterval(step, tickMs);
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // faint grid dots
    ctx.fillStyle = 'rgba(167,139,250,0.12)';
    for (var gy = 1; gy < GRID; gy++) {
      for (var gx = 1; gx < GRID; gx++) {
        ctx.fillRect(gx * CELL - 1, gy * CELL - 1, 2, 2);
      }
    }

    // food
    ctx.fillStyle = '#FFD166';
    ctx.shadowColor = '#FFD166';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
    ctx.fill();

    // snake
    for (var i = snake.length - 1; i >= 0; i--) {
      ctx.fillStyle = i === 0 ? '#FF2E88' : '#22D3EE';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = i === 0 ? 12 : 6;
      roundRect(snake[i].x * CELL + 2, snake[i].y * CELL + 2, CELL - 4, CELL - 4, 5);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function setDir(name) {
    var d = DIRS[name];
    if (!d || !running) return;
    if (d.x === -dir.x && d.y === -dir.y) return; // no 180° reversal
    nextDir = d;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' && !running) { e.preventDefault(); start(); return; }
    var name = KEYMAP[e.key];
    if (name) { e.preventDefault(); setDir(name); }
  });

  startBtn.addEventListener('click', start);

  Array.prototype.forEach.call(pad.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () { setDir(b.getAttribute('data-dir')); });
  });

  // swipe support
  var touchX = null, touchY = null;
  canvas.addEventListener('touchstart', function (e) {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
    touchX = touchY = null;
  }, { passive: true });

  // idle attract frame behind the overlay
  reset();
  draw();
})();
</script>
</body>
</html>
